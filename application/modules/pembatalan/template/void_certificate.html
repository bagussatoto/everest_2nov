<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{title}</title>

    <style>
        * {
            box-sizing: border-box;
            -moz-box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #2c3e50;
            background: #fff;
            margin: 0;
            padding: 15px;
            font-size: 11px;
            line-height: 1.4;
        }
        .cert-header {
            border-bottom: 3px double #2c3e50;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .cert-title {
            text-align: center;
            margin: 10px 0 3px 0;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #1a252f;
        }
        .cert-subtitle {
            text-align: center;
            font-size: 10px;
            color: #7f8c8d;
            font-weight: 600;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .grid-panels {
            display: table;
            width: 100%;
            margin-bottom: 15px;
        }
        .grid-col {
            display: table-cell;
            width: 50%;
            vertical-align: top;
        }
        .grid-col:first-child {
            padding-right: 8px;
        }
        .grid-col:last-child {
            padding-left: 8px;
        }
        .panel {
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            background: #fff;
            margin-bottom: 0px;
        }
        .panel-heading {
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 6px 10px;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #334155;
            text-align: center;
        }
        .panel-body {
            padding: 8px 10px;
        }
        .panel-body table {
            width: 100%;
            border-collapse: collapse;
        }
        .panel-body td {
            padding: 3px 2px;
            font-size: 11px;
            vertical-align: top;
        }
        .footer-grid {
            display: table;
            width: 100%;
            margin-top: 15px;
        }
        .footer-notes {
            display: table-cell;
            width: 60%;
            vertical-align: top;
            padding-right: 15px;
        }
        .footer-signs {
            display: table-cell;
            width: 40%;
            vertical-align: top;
        }
        table.table-bordered th {
            background-color: #f8fafc !important;
            color: #1e293b !important;
            font-weight: bold !important;
            font-size: 11px !important;
        }
        table.table-bordered td {
            font-size: 11px !important;
        }
        @media print {
            body { padding: 0; font-size: 10px; }
            .no-print { display: none !important; }
            a[href]:after { display: none; visibility: hidden; }
        }
    </style>
    <link rel="stylesheet" href="{cdn_suport}bootstrap-3.3.7-dist/css/bootstrap.min.css?v={local_version}">
</head>
<body>

<div class="cert-header">
    <div class="row">
        <div class="col-xs-6">
            {companyProfile}
        </div>
        <div class="col-xs-6 text-right">
            <img src="{base}assets/images/san_221iso.png" alt="Logo" class="img-responsive pull-right" style="max-height: 55px;">
        </div>
    </div>
</div>

<div class="cert-title">
    NOTA PEMBATALAN TRANSAKSI
</div>
<div class="cert-subtitle">
    (TRANSACTION VOID MEMO)
</div>

<div class="grid-panels">
    <div class="grid-col">
        <div class="panel panel-default">
            {voidDetails}
        </div>
    </div>
    <div class="grid-col">
        <div class="panel panel-default">
            {sourceDetails}
        </div>
    </div>
</div>

<div class="panel panel-default" style="margin-bottom: 15px;">
    {content}
</div>

<div class="footer-grid">
    <div class="footer-notes">
        <div class="panel panel-default" style="min-height: 110px;">
            {noteDetails}
        </div>
    </div>
    <div class="footer-signs">
        {sign_1}
    </div>
</div>

</body>
</html>
