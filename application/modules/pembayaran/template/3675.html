<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{title}</title>

    <script src="{cdn_suport}AdminLTE-2.3.11/plugins/jQuery/jquery-2.2.3.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-3.3.7-dist/js/bootstrap.min.js?v={local_version}"></script>
    <script src="{cdn_suport}sweetalert2-master/dist/sweetalert2.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap3-dialog-master/dist/js/bootstrap-dialog.min.js?v={local_version}"></script>
    <script src="{cdn_suport}AdminLTE-2.3.11/plugins/slimScroll/jquery.slimscroll.min.js?v={local_version}"></script>
    <script src="{cdn_suport}AdminLTE-2.3.11/dist/js/app.min.js?v={local_version}"></script>
    <script src="{cdn_suport}multi-step-modal-master/multi-step-modal.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-fileinput-master/js/fileinput.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-toggle-master/js/bootstrap-toggle.min.js?v={local_version}"></script>
    <script src="{base}assets/custom/hippo_ajax.js?v={local_version}"></script>

    <link rel="stylesheet" href="{base}assets/custom/custom.min.css?v={local_version}">
    <link rel="stylesheet" href="{cdn_suport}bootstrap-3.3.7-dist/css/bootstrap.min.css?v={local_version}">

    <style>
        * {
            box-sizing: border-box;
            -moz-box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #FAFAFA;
            font-size: 8pt;
            line-height: 1.2;
            font-family: Consolas, Menlo, Monaco, "Lucida Console", "Liberation Mono", "DejaVu Sans Mono", "Bitstream Vera Sans Mono", "Courier New", monospace, serif;
            color: #111;
        }

        .halaman-print {
            width: 210mm;
            min-height: auto;
            padding: 0;
            margin: 3px auto;
            border: 0;
            background: #9e9e9e;
        }

        .halaman {
            width: 210mm;
            min-height: 285mm;
            padding: 3mm 4mm;
            margin: 0 auto;
            border: 0;
            background: #ffffff;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.15);
        }

        .margin-halaman {
            padding: 0;
            margin: 0;
            height: auto;
            min-height: auto;
            border: 0;
        }

        /* Header logo & company profile */
        .company-logo {
            max-height: 38px;
            width: auto;
            object-fit: contain;
            margin-bottom: 2px;
        }

        .company-profile-text {
            font-size: 8pt;
            line-height: 1.2;
            padding-left: 5px;
        }

        /* Title */
        .title-divider {
            border-top: 3px double #000;
            margin-top: 2px;
            margin-bottom: 2px;
        }

        .title-nota {
            font-size: 12pt !important;
            font-weight: bold !important;
            margin: 2px 0 1px 0 !important;
            padding: 0 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.5px !important;
            line-height: 1.15 !important;
        }

        /* Info Panels (Vendor & Fixed Elements) */
        .panel-compact {
            margin-bottom: 2px !important;
            border: 1px solid #777 !important;
            border-radius: 2px !important;
            box-shadow: none !important;
        }

        .panel-compact .panel-heading {
            padding: 2px 4px !important;
            font-size: 8pt !important;
            font-weight: bold !important;
            background-color: #f2f2f2 !important;
            color: #000 !important;
            border-bottom: 1px solid #777 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.3px;
        }

        .panel-compact .panel-body {
            padding: 2px 4px !important;
        }

        .panel-compact .panel-body table {
            width: 100% !important;
            margin: 0 !important;
            border-collapse: collapse !important;
        }

        .panel-compact .panel-body table td {
            padding: 1px 2px !important;
            font-size: 7.5pt !important;
            line-height: 1.15 !important;
            vertical-align: top !important;
        }

        /* Content Box & Tables */
        .content-box {
            margin-bottom: 2px !important;
            border: 1px solid #777 !important;
            border-radius: 2px !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        .content-box > .table-responsive {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
        }

        table.table,
        .table {
            margin-bottom: 2px !important;
            font-size: 7.5pt !important;
            border-collapse: collapse !important;
            width: 100% !important;
        }

        .table-bordered,
        .table-bordered > tbody > tr > td,
        .table-bordered > tbody > tr > th,
        .table-bordered > tfoot > tr > td,
        .table-bordered > tfoot > tr > th,
        .table-bordered > thead > tr > td,
        .table-bordered > thead > tr > th {
            border: 1px solid #888 !important;
        }

        .table > thead > tr > th,
        .table > tbody > tr > th,
        .table > tfoot > tr > th,
        .table > thead > tr > td,
        .table > tbody > tr > td,
        .table > tfoot > tr > td,
        .table-condensed > thead > tr > th,
        .table-condensed > tbody > tr > th,
        .table-condensed > tfoot > tr > th,
        .table-condensed > thead > tr > td,
        .table-condensed > tbody > tr > td,
        .table-condensed > tfoot > tr > td {
            padding: 1px 2.5px !important;
            line-height: 1.12 !important;
            font-size: 7.5pt !important;
            vertical-align: middle !important;
        }

        .table > thead > tr > th,
        .table th {
            font-size: 7.5pt !important;
            font-weight: bold !important;
            background-color: #ececec !important;
            color: #000 !important;
            text-transform: uppercase !important;
            padding: 1.5px 2.5px !important;
        }

        /* Section Titles inside content (Informasi Project, Rincian Pembagian Entitas) */
        div[style*="margin-top: 15px"],
        .content-box div[style*="margin-top: 15px"],
        .main-page1 div[style*="margin-top: 15px"] {
            margin-top: 2px !important;
            margin-bottom: 1px !important;
            font-size: 8pt !important;
            font-weight: bold !important;
            letter-spacing: 0.3px;
        }

        /* Table Total & Highlight Rows */
        tr[style*="font-size:12px"],
        tr[style*="font-size:12px"] td,
        .table tr[style*="font-size:12px"],
        .table tr[style*="font-size:12px"] td {
            font-size: 7.5pt !important;
            padding: 1px 2.5px !important;
        }

        /* Bottom Section: Notes & Signatures */
        .note-container {
            border: 1px solid #777 !important;
            border-radius: 2px !important;
            margin-bottom: 0 !important;
            min-height: 48px !important;
            box-shadow: none !important;
        }

        .note-container .panel-heading {
            padding: 1.5px 4px !important;
            font-size: 8pt !important;
            font-weight: bold !important;
            background-color: #f2f2f2 !important;
            border-bottom: 1px solid #777 !important;
            text-transform: uppercase !important;
        }

        .note-container .panel-body {
            padding: 2px 4px !important;
            font-size: 7.5pt !important;
            line-height: 1.15 !important;
        }

        .note-container .panel-body table td {
            padding: 1px 2px !important;
            font-size: 7.5pt !important;
        }

        .sign-container .panel {
            border: 1px solid #777 !important;
            border-radius: 2px !important;
            margin-bottom: 0 !important;
            box-shadow: none !important;
        }

        .sign-container .panel-heading {
            padding: 1.5px 4px !important;
            font-size: 8pt !important;
            font-weight: bold !important;
            background-color: #f2f2f2 !important;
            border-bottom: 1px solid #777 !important;
            text-transform: capitalize !important;
        }

        .sign-container br {
            line-height: 5px !important;
            font-size: 5px !important;
            content: "";
            display: block;
            margin: 1px 0;
        }

        .sign-container .panel-default {
            font-size: 7.5pt !important;
            padding-bottom: 2px !important;
        }

        /* Print Media Query */
        @page {
            size: A4 portrait;
            margin: 2.5mm 3.5mm 2.5mm 3.5mm;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            html, body {
                width: 100% !important;
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
                font-size: 7.5pt !important;
                color: #000000 !important;
            }

            .halaman-print {
                width: 100% !important;
                min-height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
                background: transparent !important;
            }

            .halaman {
                width: 100% !important;
                min-height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
                background: transparent !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
            }

            .margin-halaman {
                height: auto !important;
                min-height: auto !important;
                padding: 0 !important;
                margin: 0 !important;
                border: none !important;
            }

            .main-page1 {
                page-break-inside: avoid !important;
            }

            a[href]:after {
                display: none !important;
                visibility: hidden !important;
            }

            .no-print, span.text-white {
                display: none !important;
                visibility: hidden !important;
            }
        }
    </style>
</head>

<body class="hold-transition skin-blue sidebar-mini" onload="" style="">

<div class="halaman-print">
    <div class="halaman">
        <div class="margin-halaman">
            <div class="main-page1">

                <div class="row" style="margin-left: -5px; margin-right: -5px; margin-bottom: 2px;">
                    <div class="col-xs-2 text-right" style="padding-right: 5px;">
                        <img src="{base}assets/images/san_221.png" alt="logo" class="img-responsive pull-right company-logo">
                    </div>
                    <div class="text-left col-xs-10 border-cekk company-profile-text" style="padding-left: 5px;">
                        {companyProfile}
                    </div>
                </div>

                <div class="text-center col-xs-12 no-padding title-divider">
                    <h2 class="title-nota text-bold">
                        {title}
                    </h2>
                </div>

                <div class="col-xs-12 no-padding" style="margin-bottom: 2px;">
                    <div class="col-xs-6 no-padding" style="padding-right: 3px;">
                        <div class="panel panel-default table-responsive panel-compact">
                            {vendorDetails}
                        </div>
                    </div>
                    <div class="col-xs-6 no-padding" style="padding-left: 3px;">
                        <div class="panel panel-default table-responsive panel-compact">
                            {fixedElements}
                        </div>
                    </div>
                </div>

                <div class="col-xs-12 no-padding" style="margin-bottom: 2px;">
                    <div class="panel panel-default table-responsive content-box">
                        {content}
                    </div>
                </div>

                <div class="col-xs-12 no-padding" style="margin-top: 2px;">
                    <div class="col-xs-6 no-padding" style="padding-right: 3px;">
                        <div class="panel panel-default note-container">
                            {noteDetails}
                        </div>
                    </div>
                    <div class="col-xs-6 no-padding sign-container" style="padding-left: 3px;">
                        {sign_1}
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        // Jika terdapat multiple project di info box atas, ringkas agar tidak memanjang ke bawah
        var $vendorTable = $('.panel-compact table').first();
        if ($vendorTable.length) {
            var $projectRows = $vendorTable.find('tr').filter(function () {
                var label = $(this).find('td:first').text().trim().toLowerCase();
                return label === 'project';
            });
            if ($projectRows.length > 1) {
                var totalProj = $projectRows.length;
                var $firstTr = $vendorTable.find('tr:first');
                $vendorTable.find('tr').not($firstTr).remove();
                $vendorTable.append('<tr><td style="width: 1em;white-space: nowrap;vertical-align: top;" class="text-capitalize">Project </td><td style="width: 1em;white-space: nowrap;vertical-align: top;">&nbsp; : </td><td style="vertical-align: top;" class="text-uppercase text-bold">MULTIPLE (' + totalProj + ' PROJECT - LIHAT TABEL)</td></tr>');
            }
        }
    });
</script>
</body>
</html>
